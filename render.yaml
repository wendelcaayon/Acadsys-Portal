services:
  - type: web
    name: academic-crud
    runtime: docker
    plan: free
    healthCheckPath: /health.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "15529"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        value: /var/www/html/certs/ca.pem
